# ---------------------------------------------------------------------------
# Identité du site Netlify AUTORISÉ à publier SORAHNEX
# ---------------------------------------------------------------------------
# SOURCE DE VÉRITÉ UNIQUE. Les deux rideaux de la garde la lisent :
#   - `scripts/netlify-ignore.sh`      (rideau 1, évalué avant toute installation)
#   - `scripts/netlify-build-guard.sh` (rideau 2, en tête de la commande de build)
#
# Ne jamais mettre ici de secret : ce fichier est versionné et public.
#
# ---------------------------------------------------------------------------
# PREMIER DÉPLOIEMENT — le site n'existe pas encore
# ---------------------------------------------------------------------------
# Un compte Netlify neuf, un projet neuf : l'identifiant du site n'est pas
# encore connu, puisqu'il est attribué PAR Netlify au moment de l'import. Le
# refuser rendrait le premier déploiement impossible — alors qu'il ne coûte
# aucun crédit (voir plus bas).
#
# Mécanisme (conservé pour un futur import) : `PREMIER_DEPLOIEMENT=true`
# ouvre le rideau 2 pour UNE SEULE condition — aucun identifiant autorisé
# n'est encore déclaré. Il n'ouvre rien d'autre. Il est RETIRÉ ci-dessous,
# maintenant que l'identité est connue.
#
# CE QU'IL N'OUVRE PAS
#   - Il ne dispense pas de l'opt-in (`VYORA_BUILD_ENABLED=true`).
#   - Il ne dispense pas de la branche `main`.
#   - Il ne dispense JAMAIS de l'autorisation humaine : un déploiement de
#     production réussi coûte 15 crédits Netlify, et le pool épuisé met tous les
#     sites de l'équipe en pause. Sur un compte neuf, le pool est à 300.
#   - Il n'ouvre rien sans les trois variables. Un push sur `main` SANS
#     autorisation humaine est annulé par le rideau 1, comme toujours : c'est ce
#     qui empêche un simple push de dépenser 15 crédits. AVEC les variables, le
#     build part — le premier déploiement est un acte humain explicite, pas un
#     effet de bord.
#
# APRÈS LE PREMIER DÉPLOIEMENT RÉUSSI : relever le Site ID
# (Site configuration → General → Site ID) et le déclarer ci-dessous. Puis
# RETIRER `PREMIER_DEPLOIEMENT=true` : la garde se reverrouille d'elle-même.
# Laisser ce drapeau en place indéfiniment reviendrait à accepter n'importe quel
# site — c'est pourquoi son retrait est vérifié par un test.
# PREMIER_DEPLOIEMENT=true   ← RETIRÉ, l'ouverture a rempli son rôle

# ---------------------------------------------------------------------------
# SITE AUTORISÉ — identité relevée au premier build réel (25/11/2026)
# ---------------------------------------------------------------------------
# Valeur lue dans le journal Netlify, ligne « build autorisé : site … », pas
# recopiée depuis le tableau de bord : c'est l'identité que le build a
# réellement présentée.
SITE_ID=8d485fbd-ec54-4068-b3db-cd28145c6007

# Le nom fait foi en second. S'il est renommé un jour côté Netlify, seul
# l'identifiant ci-dessus continue de compter.
SITE_NAME=saas-ugc

# ---------------------------------------------------------------------------
# Anciens sites : refusés nommément, même si leur identifiant était recopié par
# erreur. Ce ne sont PAS des cibles de migration.
# ---------------------------------------------------------------------------
# `vyora-ugc` : site fermé, refusé depuis l'origine.
ANCIEN_SITE_NAME=vyora-ugc

# Ancien compte Netlify, encore en service. L'ancien site ne doit jamais être
# republié par accident : il est écarté explicitement.
ANCIEN_SITE_ID=fc88d197-fe0b-47c7-a6e3-fba44eeccda9
