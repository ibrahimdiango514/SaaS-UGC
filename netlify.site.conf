# ---------------------------------------------------------------------------
# Identité du site Netlify AUTORISÉ à publier SORAHNEX
# ---------------------------------------------------------------------------
# SOURCE DE VÉRITÉ UNIQUE. Les deux rideaux de la garde la lisent :
#   - `scripts/netlify-ignore.sh`      (rideau 1, évalué avant toute installation)
#   - `scripts/netlify-build-guard.sh` (rideau 2, en tête de la commande de build)
#
# MIGRER VERS UN NOUVEAU SITE = changer SITE_ID, par PR (ou d'un geste avec
# `sh scripts/netlify-autoriser-site.sh <SITE_ID> <SITE_NAME>`).
#
# Ne jamais mettre ici de secret : ce fichier est versionné et public.
#
# ---------------------------------------------------------------------------
# SITE AUTORISÉ — identité fournie par le propriétaire le 25 novembre 2026
# ---------------------------------------------------------------------------
# L'identifiant fait FOI. Le nom n'est volontairement PAS contraint ici : Netlify
# a recréé le site, et son nom exact (suffixe aléatoire éventuel) n'est pas connu
# avec certitude, alors que l'identifiant, lui, est certain. Inventer un nom
# ferait échouer un déploiement légitime pour une raison cosmétique.
#
# Ce n'est pas un affaiblissement : l'identifiant est unique, non devinable, et
# attribué par Netlify. C'est lui qui empêche de publier sur un autre site.
# `SITE_NAME_FACULTATIF=true` rend explicite ce choix — le retirer réactive
# l'exigence du nom.
SITE_ID=2135cb38-c4ba-4be2-9392-4b75ff414364
SITE_NAME_FACULTATIF=true

# ---------------------------------------------------------------------------
# Anciens sites : refusés nommément, même si leur identifiant était recopié par
# erreur. Ce ne sont PAS des cibles de migration.
# ---------------------------------------------------------------------------
# `vyora-ugc` : site fermé, refusé depuis l'origine.
ANCIEN_SITE_NAME=vyora-ugc

# Ancien compte Netlify, encore en service : refusé explicitement, pour qu'une
# bascule ne republie jamais par accident sur l'ancien hébergement.
ANCIEN_SITE_ID=fc88d197-fe0b-47c7-a6e3-fba44eeccda9

# Sites qui ont tenté de construire sans être autorisés, et qui le restent. Les
# consigner évite de les confondre avec un site inconnu : le refus les nomme.
#   09412497-… (saas-ugc-0d54) : refusé le 25/11/2026, remplacé par le site ci-dessus.
