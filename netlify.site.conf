# ---------------------------------------------------------------------------
# Identité du site Netlify AUTORISÉ à publier SORAHNEX
# ---------------------------------------------------------------------------
# SOURCE DE VÉRITÉ UNIQUE. Les deux rideaux de la garde la lisent :
#   - `scripts/netlify-ignore.sh`      (rideau 1, évalué avant toute installation)
#   - `scripts/netlify-build-guard.sh` (rideau 2, en tête de la commande de build)
#
# MIGRER VERS UN NOUVEAU SITE = remplacer les deux valeurs ci-dessous, par PR.
# Aucun autre fichier à modifier. Les tests
# (tests/netlify-deployment-guard.test.ts) vérifient que les deux rideaux lisent
# bien CE fichier et refusent tout ce qui n'y correspond pas.
#
# Ne jamais mettre ici de secret : ce fichier est versionné et public.
#
# ---------------------------------------------------------------------------
# SITE AUTORISÉ — choisi par le propriétaire le 25 novembre 2026
# ---------------------------------------------------------------------------
# `saas-ugc` devient le site de production SORAHNEX. Il avait été refusé le même
# jour (déploiement tenté depuis main, zéro crédit consommé) parce qu'il n'était
# pas encore déclaré. Il l'est maintenant.
#
# Publier n'est TOUJOURS PAS possible avec ces seules valeurs : il faut encore
# déclarer sur le site, juste avant de publier, les trois variables
#   VYORA_BUILD_ENABLED=true
#   SORAHNEX_DEPLOY_AUTHORIZED=true
#   SORAHNEX_DEPLOY_AUTHORIZED_NAME=sorahnex-deploy
# puis retirer les deux dernières. C'est le verrou de crédits : un déploiement de
# production réussi coûte 15 crédits Netlify, et un pool épuisé met TOUS les sites
# de l'équipe en pause. Voir docs/NETLIFY_DEPLOYMENT_CHECKLIST.md.
SITE_ID=6ec85a76-bf5f-4eed-9d9e-0a8f6b7f9803
SITE_NAME=saas-ugc

# ---------------------------------------------------------------------------
# Anciens sites : refusés catégoriquement, même si leur identifiant était recopié
# par erreur. Ce ne sont PAS des cibles de migration.
# ---------------------------------------------------------------------------
# `vyora-ugc` : site fermé, refusé depuis l'origine.
ANCIEN_SITE_NAME=vyora-ugc

# `vyora-saas-ugc` : site de l'ancien compte Netlify, encore en service. Refusé
# comme cible de façon EXPLICITE : il a son propre déploiement, et une bascule ne
# doit jamais republier par accident sur l'ancien hébergement.
ANCIEN_SITE_ID=fc88d197-fe0b-47c7-a6e3-fba44eeccda9
