name: Vérification de production

# Objet : constater ce que la production sert RÉELLEMENT, et non ce qu'on croit
# avoir publié. Le CDN peut répondre l'ancien HTML après un déploiement réussi,
# et « le build passe » ne prouve rien sur le site public.
#
# Cet environnement de développement n'a pas d'accès réseau aux domaines de
# production : la vérification est donc exécutée par un runner GitHub, qui lui
# a un accès normal, et la sortie est lisible directement dans les logs.
#
# Aucun secret n'est utilisé : ces deux points d'entrée sont publics et leur
# réponse anonyme est précisément ce qu'on veut mesurer.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "URL du site public à contrôler"
        required: false
        default: "https://vyora-ugc.netlify.app"
      function_url:
        description: "URL de l'Edge Function store-import"
        required: false
        default: "https://xbuuhfwobrafcbgtdgjx.supabase.co/functions/v1/store-import"

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Site public — code HTTP et cachet de révision
        env:
          SITE: ${{ inputs.site_url }}
        run: |
          set -u
          echo "URL: $SITE"
          code=$(curl -sS -o /tmp/site.html -w '%{http_code}' --max-time 30 "$SITE" || echo "000")
          echo "HTTP: $code"
          echo "Octets: $(wc -c < /tmp/site.html 2>/dev/null || echo 0)"

          # Le commit attendu est celui de la tête de main, lu depuis l'API
          # publique du dépôt : on compare deux faits, sans rien supposer.
          attendu=$(curl -sS --max-time 30 https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main \
            | grep -o '"sha": *"[0-9a-f]*"' | head -1 | grep -o '[0-9a-f]\{40\}' | cut -c1-7 || true)
          echo "Commit attendu (main): ${attendu:-inconnu}"

          cachet=$(grep -o 'name="vyora-revision" content="[^"]*"' /tmp/site.html 2>/dev/null \
            | sed 's/.*content="//; s/"//' || true)
          echo "Cachet servi: ${cachet:-absent}"

          if [ -z "$cachet" ]; then
            echo "::warning::Aucun cachet de révision servi — le déploiement ne contient pas cette livraison (ou le site sert un build antérieur)."
          elif [ "$cachet" = "dev" ]; then
            echo "::warning::Cachet « dev » : build sans référence de commit."
          elif [ -n "$attendu" ] && [ "$cachet" != "$attendu" ]; then
            echo "::warning::Le site sert $cachet alors que main est à $attendu — propagation en cours ou déploiement non déclenché."
          else
            echo "OK: le site public sert bien la révision de main."
          fi

      - name: Edge Function store-import — refus anonyme attendu
        env:
          FN: ${{ inputs.function_url }}
        run: |
          set -u
          # verify_jwt = true : un appel sans jeton DOIT être refusé en 401.
          # Un 503 STORE_IMPORT_ARTIFACT_UNAVAILABLE signifierait que la fonction
          # répond mais que son artefact n'est pas chargeable.
          # Un 5xx générique ou une erreur TLS signifierait un problème distinct.
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 \
            -X POST "$FN" \
            -H 'content-type: application/json' \
            --data '{"action":"preview"}' || echo "000")
          echo "HTTP: $code"
          echo "Réponse: $(head -c 400 "$body" 2>/dev/null)"

          case "$code" in
            401) echo "OK: jeton exigé (verify_jwt actif), chargeur démarré." ;;
            503) echo "::warning::Fonction joignable mais artefact indisponible (503)." ;;
            000) echo "::error::Aucune réponse HTTP (réseau ou fonction absente)." ; exit 1 ;;
            *)   echo "::warning::Code inattendu ($code) pour un appel anonyme." ;;
          esac
