project_id = "xbuuhfwobrafcbgtdgjx"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
# Origines explicites uniquement : aucun wildcard sur un domaine entier.
# En production, ajouter ici l'origine exacte de l'application déployée.
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:4173/**", "https://reelora.netlify.app/**"]
enable_signup = true

[functions.reelora-health]
verify_jwt = false

[functions.reelora-owner-bootstrap]
verify_jwt = false

[functions.reelora-ai]
verify_jwt = true

[functions.reelora-video]
verify_jwt = true

[functions.business-grow]
verify_jwt = true

# Callback MuAPI + réconciliation pg_cron : MuAPI ne peut pas envoyer de JWT
# Supabase. La protection repose sur le jeton Vault `reelora_worker_token`
# (comparaison à temps constant) + re-vérification serveur de l'état réel.
[functions.reelora-video-worker]
verify_jwt = false

# Surveillance planifiée des fournisseurs IA (pg_cron -> pg_net). Le job ne peut
# pas présenter de JWT utilisateur : la protection repose sur un jeton Vault
# comparé à temps constant + l'en-tête `x-vyora-cron`. Contrôle catalogue
# uniquement (aucune génération, aucun crédit).
[functions.vyora-provider-health]
verify_jwt = false

# Paiements SasPay de VYORA (devis, création de commande, statut, soldes en
# lecture seule). Appelée par le navigateur : JWT utilisateur obligatoire.
[functions.vyora-payments]
verify_jwt = true

# Webhook SasPay : SasPay ne peut pas présenter de JWT Supabase. La protection
# repose sur la signature HMAC-SHA256 du corps brut (secret
# VYORA_SASPAY_WEBHOOK_SECRET, tolérance 300 s) + re-vérification serveur du
# paiement (`GET /payments/{id}/verify/`) avant toute livraison.
[functions.vyora-saspay-webhook]
verify_jwt = false
