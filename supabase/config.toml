[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
# Origines explicites uniquement : aucun wildcard sur un domaine entier.
# En production, ajouter ici l'origine exacte de l'application déployée.
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:4173/**", "https://reelora.netlify.app/**"]
enable_signup = true

[functions.reelora-health]
verify_jwt = false

[functions.reelora-owner-bootstrap]
verify_jwt = false

[functions.reelora-ai]
verify_jwt = true

[functions.reelora-video]
verify_jwt = true

[functions.business-grow]
verify_jwt = true

# Callback MuAPI + réconciliation pg_cron : MuAPI ne peut pas envoyer de JWT
# Supabase. La protection repose sur le jeton Vault `reelora_worker_token`
# (comparaison à temps constant) + re-vérification serveur de l'état réel.
[functions.reelora-video-worker]
verify_jwt = false

# Surveillance planifiée des fournisseurs IA (pg_cron -> pg_net). Le job ne peut
# pas présenter de JWT utilisateur : la protection repose sur un jeton Vault
# comparé à temps constant + l'en-tête `x-vyora-cron`. Contrôle catalogue
# uniquement (aucune génération, aucun crédit).
[functions.vyora-provider-health]
verify_jwt = false

# Paiements SasPay de VYORA (devis, création de commande, statut, soldes en
# lecture seule). Appelée par le navigateur : JWT utilisateur obligatoire.
[functions.vyora-payments]
verify_jwt = true

# Webhook SasPay : SasPay ne peut pas présenter de JWT Supabase. La protection
# repose sur la signature HMAC-SHA256 du corps brut (secret
# VYORA_SASPAY_WEBHOOK_SECRET, tolérance 300 s) + re-vérification serveur du
# paiement (`GET /payments/{id}/verify/`) avant toute livraison.
[functions.vyora-saspay-webhook]
verify_jwt = false

# Réconciliation planifiée des paiements SasPay (pg_cron -> pg_net). Le job ne
# peut pas présenter de JWT utilisateur : la protection repose sur l'en-tête
# `x-vyora-cron: payments-reconcile` puis sur le jeton Vault
# `vyora_payments_reconcile_token`, comparé à temps constant. Lecture seule côté
# SasPay ; ne livre que par le règlement idempotent, après vérification.
[functions.vyora-payments-reconcile]
verify_jwt = false

# Connexion Meta (WhatsApp Business, Facebook Pages, Messenger, Instagram
# Business). Appelée par le navigateur avec le JWT VYORA : la fonction revérifie
# elle-même le JWT auprès de GoTrue, l'abonnement Business Grow actif
# (`bg_import_access`) et les droits sur l'entreprise (`bg_can_workspace`).
# OAuth Meta : le GET /callback est une redirection du navigateur depuis
# facebook.com. Le navigateur n'envoie aucun en-tête Authorization sur une
# redirection : la passerelle rejetterait la requête avant le handler. Le
# handler vérifie donc lui-même le JWT des actions POST (deps.getUserId) et
# s'appuie sur `state` (usage unique, TTL court, lié à l'utilisateur et à
# l'entreprise) pour le retour, exactement comme les autres endpoints sans JWT
# de la plateforme.
[functions.meta-connect]
verify_jwt = false

# Webhook Meta : Meta ne peut présenter aucun JWT Supabase. La protection
# repose sur la signature `X-Hub-Signature-256` (HMAC-SHA256 de l'App Secret sur
# le corps brut, comparaison à temps constant), sur `hub.verify_token` pour la
# vérification d'abonnement, et sur la résolution en base de l'identifiant Meta
# reçu : un WABA ou une page inconnus de VYORA ne créent aucune donnée.
[functions.meta-webhook]
verify_jwt = false

# Rappels de cycle de vie Meta (dé-autorisation et suppression de données).
#
# Meta poste ici un `signed_request` (POST `application/x-www-form-urlencoded`),
# sans aucun JWT Supabase : `verify_jwt = false` est donc obligatoire, sinon la
# passerelle rejette l'appel avant le handler.
#
# La sécurité ne repose donc PAS sur un jeton mais sur la signature HMAC-SHA256
# de l'App Secret sur la charge utile (voir src/business/meta/deauthorize.ts) :
# sans signature valide, la requête est refusée en 401 et aucune donnée n'est
# touchée. C'est le seul contrôle possible ici — et il suffit, car il prouve que
# l'appel vient de Meta.
[functions.meta-lifecycle]
verify_jwt = false
