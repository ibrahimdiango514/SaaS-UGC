[build]
  command = "npm ci && npm run build"
  publish = "dist"
  # ---------------------------------------------------------------------------
  # GARDE DE BUILD (2026-11-18, préparation du nouveau compte Netlify)
  #
  # Convention Netlify : si cette commande renvoie 0, le build est ANNULÉ avant
  # toute installation ; tout autre code = build normal. Elle n'est évaluée que
  # pour les builds déclenchés par Git ; un « Trigger deploy » manuel l'ignore.
  #
  # Trois conditions, dans l'ordre ; la première vraie annule le build :
  #   1. `$SITE_NAME` = « vyora-ugc » : l'ANCIEN site Netlify (24 crédits
  #      restants) ne doit plus rien construire. Tant qu'il reste relié au
  #      dépôt, chaque fusion dans `main` tenterait un build : il est coupé ici,
  #      quelle que soit la branche.
  #   2. `$VYORA_BUILD_ENABLED` ≠ « true » : seul un site qui déclare
  #      explicitement cette variable d'environnement (Site configuration →
  #      Environment variables) construit. Le nouveau site la définit ; aucun
  #      site relié par erreur ne consomme de crédit. C'est aussi ce qui permet
  #      de ne PAS inventer le nom du futur site dans ce fichier.
  #   3. `$BRANCH` ≠ « main » : aucune branche de travail, aucun Deploy Preview.
  #      `main` est la seule source importée dans le nouveau compte.
  #
  # Voir docs/migration-nouveau-netlify.md pour la procédure complète.
  ignore = '[ "$SITE_NAME" = "vyora-ugc" ] || [ "$VYORA_BUILD_ENABLED" != "true" ] || [ "$BRANCH" != "main" ]'

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Relais zero-secret vers Supabase Edge Function business-grow pour les Deploy Previews Netlify
[[edge_functions]]
  path = "/api/business-grow"
  function = "business-grow"

# SPA fallback : toutes les routes React sont servies par index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Relais zero-secret vers l'Edge Function `reelora-video` (Studio, références
# multiples). Le navigateur n'appelle jamais *.supabase.co directement : il
# passe par cette origine, et le relais ajoute le jeton et les en-têtes.
# Même motif que le relais business-grow ci-dessus : aucun secret dans le
# bundle, aucune clé côté client.
[[edge_functions]]
  path = "/api/reelora-video"
  function = "reelora-video"
