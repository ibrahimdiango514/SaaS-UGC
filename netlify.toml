[build]
  # ---------------------------------------------------------------------------
  # GARDE DE DÉPLOIEMENT — deux rideaux, une seule source de vérité
  #
  # L'identité du site autorisé n'est PLUS écrite ici : elle vit dans
  # `netlify.site.conf`, lu par les deux rideaux. Migrer vers un nouveau site
  # Netlify = remplacer SITE_ID et SITE_NAME dans ce fichier, par PR, et rien
  # d'autre. (Avant : le même identifiant recopié dans une commande `ignore` de
  # 700 caractères et dans un script séparé — deux occasions de bloquer un
  # déploiement légitime à la dernière minute.)
  #
  # Rideau 1 — `ignore = "sh scripts/netlify-ignore.sh"` : évalué AVANT toute
  # installation. Code 0 = build ANNULÉ, zéro crédit. Code 1 = on continue.
  # Rideau 2 — `command` commence par `sh scripts/netlify-build-guard.sh` :
  # revérifie la même chose dans l'environnement de build complet, AVANT
  # `npm ci`. Un « Trigger deploy » manuel ne contourne pas ce rideau.
  #
  # Logique commune : `scripts/netlify-guard-lib.sh` (les deux rideaux ne peuvent
  # pas diverger). Huit conditions, toutes exigées, FERMÉ par défaut :
  #   SITE_ID = identifiant de netlify.site.conf   SITE_NAME = nom de netlify.site.conf
  #   SITE_ID/SITE_NAME ∉ liste ANCIEN_SITE_* (hébergements abandonnés, refus
  #                                              explicite ; plusieurs lignes)
  #   BRANCH = main                                VYORA_BUILD_ENABLED = true
  #   SORAHNEX_DEPLOY_AUTHORIZED = true            SORAHNEX_DEPLOY_AUTHORIZED_NAME = sorahnex-deploy
  #
  # Les deux dernières variables forment le VERROU DE CRÉDITS : un déploiement
  # de production réussi coûte 15 crédits Netlify, et le pool épuisé met tous les
  # sites de l'équipe en pause. La consigne reste : les RETIRER après le
  # déploiement voulu. Tant qu'elles sont déclarées, chaque poussée sur `main`
  # publie — c'est l'état à ne pas laisser traîner. Voir
  # docs/NETLIFY_DEPLOYMENT_CHECKLIST.md.
  #
  # Constat de terrain (journal du déploiement ca410d5, 2026-11-18) : Netlify
  # expose bien BRANCH, SITE_ID et SITE_NAME à l'étape `ignore`.
  #
  # Local : `sh scripts/netlify-ignore.sh` sans variables annule, sans rien
  # toucher — on ne peut pas confondre un test local avec une publication.
  # ---------------------------------------------------------------------------
  command = "sh scripts/netlify-build-guard.sh && npm ci && npm run build"
  publish = "dist"
  ignore = "sh scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  # ---------------------------------------------------------------------------
  # SCANNER DE SECRETS NETLIFY — un seul faux positif, neutralisé à la source
  # ---------------------------------------------------------------------------
  # `SORAHNEX_DEPLOY_AUTHORIZED_NAME` vaut le jeton `sorahnex-deploy`. Ce n'est
  # PAS un secret : c'est un jeton public, documenté à dessein dans
  # `netlify.toml`, `scripts/netlify-guard-lib.sh`, `.env.example` et la
  # checklist. Il ne donne aucun accès à lui seul — l'autorisation exige
  # `SORAHNEX_DEPLOY_AUTHORIZED=true`, qui elle n'est écrite nulle part.
  #
  # Sans cette ligne, le build échoue APRÈS une compilation réussie (constaté le
  # 25/11/2026, build de production) : le scanner trouve le jeton dans 26
  # emplacements et refuse de publier. Il ne s'agit pas d'une fuite.
  #
  # On neutralise la DÉTECTION pour ces clés précises, pas le scanner : toute
  # autre valeur marquée secrète reste surveillée. `SECRETS_SCAN_ENABLED=false`
  # serait la solution paresseuse — elle désactiverait la protection entière.
  #
  # Les trois VITE_ sont dans la même situation, pour une raison plus radicale :
  # elles sont PUBLIÉES dans le bundle (vérifié : `index-*.js` de `dist/`
  # contient l'URL Supabase, la clé publiable et l'URL du site). Un client
  # Supabase a besoin de ces valeurs dans le navigateur — c'est leur seul rôle.
  # Les marquer « secrètes » rendrait donc tout build impossible, puisque le
  # scanner inspecte aussi les fichiers produits. Ce sont des valeurs publiques,
  # pas des fuites : aucune clé serveur n'est jamais placée ici.
  SECRETS_SCAN_OMIT_KEYS = "SORAHNEX_DEPLOY_AUTHORIZED_NAME,VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SITE_URL"

# Relais zero-secret vers Supabase Edge Function business-grow pour les Deploy Previews Netlify
[[edge_functions]]
  path = "/api/business-grow"
  function = "business-grow"

# SPA fallback : toutes les routes React sont servies par index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Relais zero-secret vers l'Edge Function `reelora-video` (Studio, références
# multiples). Le navigateur n'appelle jamais *.supabase.co directement : il
# passe par cette origine, et le relais ajoute le jeton et les en-têtes.
# Même motif que le relais business-grow ci-dessus : aucun secret dans le
# bundle, aucune clé côté client.
[[edge_functions]]
  path = "/api/reelora-video"
  function = "reelora-video"
