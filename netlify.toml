[build]
  # ---------------------------------------------------------------------------
  # GARDE DE BUILD À DEUX RIDEAUX (2026-11-18, nouveau compte Netlify)
  #
  # Site de production autorisé : Site ID fc88d197-fe0b-47c7-a6e3-fba44eeccda9
  # (https://vyora-saas-ugc.netlify.app). Ancien site : nom « vyora-ugc »,
  # ancien compte — jamais déployé, quel que soit son identifiant.
  #
  # Rideau 1 — `ignore` (ci-dessous) : évalué AVANT toute installation, code 0
  # = build annulé sans coût. Il n'est pas prouvé que Netlify expose SITE_ID /
  # SITE_NAME à cette étape : le déploiement de 14a61ec a été ignoré alors que
  # le site est le bon, et la garde précédente par SITE_NAME n'avait jamais
  # bloqué un site pourtant nommé vyora-ugc. Ce rideau ne tranche donc l'identité
  # que si la variable est PRÉSENTE ; sinon il laisse passer vers le rideau 2.
  # Il garde ce qu'il voit sûrement : la branche et l'opt-in explicite.
  #
  # Rideau 2 — `scripts/netlify-build-guard.sh`, en tête de la commande de
  # build, dans l'environnement complet où SITE_ID et SITE_NAME sont documentés :
  # refus (code 1, donc pas de déploiement) si l'identifiant n'est pas celui du
  # site autorisé, si le nom est celui de l'ancien site, si la branche n'est pas
  # main ou si l'opt-in manque. Les valeurs reçues sont écrites dans le journal.
  #
  # Changer de site = modifier l'identifiant aux DEUX endroits, par PR ; les
  # tests (tests/business-grow-deployment-guard.test.ts) vérifient qu'ils sont
  # identiques. Voir docs/migration-nouveau-netlify.md.
  # ---------------------------------------------------------------------------
  command = "sh scripts/netlify-build-guard.sh fc88d197-fe0b-47c7-a6e3-fba44eeccda9 && npm ci && npm run build"
  publish = "dist"
  ignore = 'echo "garde ignore: BRANCH=${BRANCH:-absent} VYORA_BUILD_ENABLED=${VYORA_BUILD_ENABLED:-absent} SITE_ID=${SITE_ID:-absent} SITE_NAME=${SITE_NAME:-absent}"; [ "$VYORA_BUILD_ENABLED" != "true" ] || [ "$BRANCH" != "main" ] || [ "$SITE_NAME" = "vyora-ugc" ] || { [ -n "$SITE_ID" ] && [ "$SITE_ID" != "fc88d197-fe0b-47c7-a6e3-fba44eeccda9" ]; }'

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Relais zero-secret vers Supabase Edge Function business-grow pour les Deploy Previews Netlify
[[edge_functions]]
  path = "/api/business-grow"
  function = "business-grow"

# SPA fallback : toutes les routes React sont servies par index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Relais zero-secret vers l'Edge Function `reelora-video` (Studio, références
# multiples). Le navigateur n'appelle jamais *.supabase.co directement : il
# passe par cette origine, et le relais ajoute le jeton et les en-têtes.
# Même motif que le relais business-grow ci-dessus : aucun secret dans le
# bundle, aucune clé côté client.
[[edge_functions]]
  path = "/api/reelora-video"
  function = "reelora-video"
