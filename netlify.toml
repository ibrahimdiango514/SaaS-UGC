[build]
  # ---------------------------------------------------------------------------
  # GARDE DE BUILD À DEUX RIDEAUX (2026-11-18, nouveau compte Netlify)
  #
  # Site de production autorisé — les QUATRE conditions sont exigées :
  #   BRANCH              = main
  #   SITE_ID             = fc88d197-fe0b-47c7-a6e3-fba44eeccda9
  #   SITE_NAME           = vyora-saas-ugc   (https://vyora-saas-ugc.netlify.app)
  #   VYORA_BUILD_ENABLED = true             (variable à déclarer sur le site)
  # L'ancien site (nom « vyora-ugc », ancien compte) est refusé explicitement,
  # en plus de l'être par l'identité positive ci-dessus.
  #
  # Preuve de terrain (journal du déploiement ca410d5) : Netlify expose bien
  # BRANCH, SITE_ID et SITE_NAME à l'étape `ignore` ; VYORA_BUILD_ENABLED était
  # « absent » sur le nouveau site → annulation attendue, affichée par Netlify
  # « Canceled build due to no content change » (libellé générique de toute
  # annulation par `ignore`, sans rapport avec le contenu).
  #
  # Rideau 1 — `ignore` : évalué AVANT toute installation ; code 0 = annulé sans
  # coût. Journalise les valeurs reçues puis n'autorise (code 1) que si les quatre
  # conditions sont vraies. Variable absente = refus (fermé par défaut).
  # Rideau 2 — `scripts/netlify-build-guard.sh` en tête de la commande de build :
  # mêmes quatre conditions, revérifiées dans l'environnement complet, message de
  # refus explicite, échec avant `npm ci` (aucun déploiement). Un « Trigger
  # deploy » manuel contourne le rideau 1 mais pas le rideau 2.
  #
  # Changer de site = modifier identifiant ET nom aux DEUX endroits, par PR ; les
  # tests (tests/business-grow-deployment-guard.test.ts) vérifient la cohérence.
  # Procédure de la variable : docs/migration-nouveau-netlify.md §3.
  # ---------------------------------------------------------------------------
  command = "sh scripts/netlify-build-guard.sh fc88d197-fe0b-47c7-a6e3-fba44eeccda9 vyora-saas-ugc && npm ci && npm run build"
  publish = "dist"
  ignore = 'echo "garde ignore: BRANCH=${BRANCH:-absent} VYORA_BUILD_ENABLED=${VYORA_BUILD_ENABLED:-absent} SITE_ID=${SITE_ID:-absent} SITE_NAME=${SITE_NAME:-absent}"; if [ "$SITE_NAME" != "vyora-ugc" ] && [ "$VYORA_BUILD_ENABLED" = "true" ] && [ "$BRANCH" = "main" ] && [ "$SITE_ID" = "fc88d197-fe0b-47c7-a6e3-fba44eeccda9" ] && [ "$SITE_NAME" = "vyora-saas-ugc" ]; then echo "garde ignore: build autorise"; exit 1; else echo "garde ignore: build annule (conditions non reunies)"; exit 0; fi'

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Relais zero-secret vers Supabase Edge Function business-grow pour les Deploy Previews Netlify
[[edge_functions]]
  path = "/api/business-grow"
  function = "business-grow"

# SPA fallback : toutes les routes React sont servies par index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Permissions-Policy : microphone ouvert à NOTRE origine seulement.
#
# La dictée vocale du chat (Business Grow et assistant VYORA) passe par l'API
# `SpeechRecognition` du navigateur, qui exige l'autorisation micro. Avec
# `microphone=()`, le navigateur refuse AVANT même de demander l'accord de
# l'utilisateur : le bouton aurait été définitivement mort en production, quel
# que soit le code de l'application.
#
# `microphone=(self)` n'ouvre rien aux iframes ni aux tiers : seul le document
# de vyora-saas-ugc.netlify.app peut solliciter le micro, et l'utilisateur doit
# toujours accepter explicitement. `camera` et `geolocation` restent fermés —
# nous n'en avons aucun usage.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

# Relais zero-secret vers l'Edge Function `reelora-video` (Studio, références
# multiples). Le navigateur n'appelle jamais *.supabase.co directement : il
# passe par cette origine, et le relais ajoute le jeton et les en-têtes.
# Même motif que le relais business-grow ci-dessus : aucun secret dans le
# bundle, aucune clé côté client.
[[edge_functions]]
  path = "/api/reelora-video"
  function = "reelora-video"
