[build]
  command = "npm ci && npm run build"
  publish = "dist"
  # ---------------------------------------------------------------------------
  # GARDE DE BUILD (2026-11-18, révisée 2026-11-22 : nouveau compte Netlify)
  #
  # Convention Netlify : si cette commande renvoie 0, le build est ANNULÉ avant
  # toute installation ; tout autre code = build normal. Elle n'est évaluée que
  # pour les builds déclenchés par Git ; un « Trigger deploy » manuel l'ignore.
  #
  # Pourquoi l'identifiant et non le nom : l'ancien site et le nouveau portent
  # le MÊME nom `vyora-ugc` (même URL https://vyora-ugc.netlify.app). Une garde
  # par `$SITE_NAME` bloquait donc aussi le nouveau site. `$SITE_ID` (API ID,
  # UUID attribué à la création, visible dans Site configuration → General →
  # Site details) est le seul identifiant que deux sites ne partagent jamais.
  #
  # Trois conditions, dans l'ordre ; la première vraie annule le build :
  #   1. `$SITE_ID` ≠ identifiant du NOUVEAU site (compte Netlify actuel) :
  #      l'ancien site (supprimé, autre identifiant), tout site recréé ou relié
  #      par erreur au dépôt est coupé ici, quelle que soit la branche. Changer
  #      de site = mettre à jour cette valeur dans une PR, jamais à la volée.
  #   2. `$VYORA_BUILD_ENABLED` ≠ « true » : le site doit en plus déclarer
  #      explicitement cette variable (Site configuration → Environment
  #      variables). Deux preuves indépendantes valent mieux qu'une.
  #   3. `$BRANCH` ≠ « main » : aucune branche de travail, aucun Deploy Preview.
  #      `main` est la seule source déployée en production.
  #
  # Voir docs/migration-nouveau-netlify.md pour la procédure complète.
  ignore = '[ "$SITE_ID" != "fc88d197-fe0b-47c7-a6e3-fba44eeccda9" ] || [ "$VYORA_BUILD_ENABLED" != "true" ] || [ "$BRANCH" != "main" ]'

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Relais zero-secret vers Supabase Edge Function business-grow pour les Deploy Previews Netlify
[[edge_functions]]
  path = "/api/business-grow"
  function = "business-grow"

# SPA fallback : toutes les routes React sont servies par index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Relais zero-secret vers l'Edge Function `reelora-video` (Studio, références
# multiples). Le navigateur n'appelle jamais *.supabase.co directement : il
# passe par cette origine, et le relais ajoute le jeton et les en-têtes.
# Même motif que le relais business-grow ci-dessus : aucun secret dans le
# bundle, aucune clé côté client.
[[edge_functions]]
  path = "/api/reelora-video"
  function = "reelora-video"
