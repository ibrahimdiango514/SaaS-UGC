[build]
  command = "npm ci && npm run build"
  publish = "dist"
  # Filet de sécurité : aucun build Netlify pour les branches de travail de la
  # PR #6 et de la Phase 3 Business Grow tant que leur déploiement n'est pas
  # décidé. Les relais existants ciblent la base de production : un aperçu de
  # la Phase 3 ne doit pas être publié isolément. Code 0 = build annulé avant
  # toute installation ; tout autre code = build normal. `main` et les autres
  # branches continuent de se construire exactement comme avant.
  # Garder aussi [skip netlify] dans les commits de ces branches et les titres
  # de leurs éventuelles PR. Une préproduction exige une cible isolée vérifiée.
  ignore = '[ "$HEAD" = "arena/323bad30-saas-ugc" ] || [ "$BRANCH" = "arena/323bad30-saas-ugc" ] || [ "$HEAD" = "arena/ada94e4c-saas-ugc" ] || [ "$BRANCH" = "arena/ada94e4c-saas-ugc" ]'

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Relais zero-secret vers Supabase Edge Function business-grow pour les Deploy Previews Netlify
[[edge_functions]]
  path = "/api/business-grow"
  function = "business-grow"

# SPA fallback : toutes les routes React sont servies par index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
